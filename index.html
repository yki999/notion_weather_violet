<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Shimacho Weather</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            var(--main-purple): #9D7BFF; 
            var(--light-purple): #c2adff;
        }
        body {
            background: transparent;
            color: #9D7BFF;
            /* 読み込んだGoogle Fontsを最優先に適用 */
            font-family: 'Playfair Display', "Times New Roman", "YuMincho", "Hiragino Mincho ProN", serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .widget-title {
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 35px;
        }
        .day-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .day-label {
            font-size: 18px;
            margin-bottom: 5px;
        }
        .icon {
            font-size: 30px;
            margin: 10px 0;
        }
        .temp-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .temp-max {
            font-size: 16px;
            font-weight: bold;
        }
        .temp-min {
            font-size: 14px;
            color: #c2adff;
        }
        /* 右下に出典を小さく固定表示 */
        .source {
            position: fixed;
            bottom: 8px;
            right: 12px;
            font-size: 10px;
            opacity: 0.6;
            text-decoration: none;
            color: #9D7BFF;
            font-family: sans-serif; /* 出典は読みやすいゴシック体 */
        }
        .source:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="widget-title">SHIMACHO WEATHER</div>
    
    <div class="container" id="weather-display">
        Loading...
    </div>

    <a href="https://open-meteo.com/" target="_blank" class="source">※出典: JMA / Open-Meteo</a>

    <script>
        async function getWeather() {
            try {
                // 島町の緯度経度を指定し、気象庁(jma_seamless)の予測モデルを利用する安定したAPI
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=35.9461&longitude=139.6644&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&models=jma_seamless';
                
                const res = await fetch(url);
                const data = await res.json();
                
                const daily = data.daily;
                let html = '';
                const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                
                // 直近3日分を表示
                for (let i = 0; i < 3; i++) {
                    const date = new Date(daily.time[i]);
                    const today = new Date();
                    
                    const isToday = (date.getDate() === today.getDate() && date.getMonth() === today.getMonth());
                    const dayLabel = isToday ? 'Today' : dayNames[date.getDay()];
                    
                    // 天気コードから絵文字へ変換
                    let icon = "☁️"; 
                    const code = daily.weathercode[i];
                    if (code === 0 || code === 1) icon = "☀️";
                    else if (code === 2) icon = "⛅";
                    else if (code === 3) icon = "☁️";
                    else if (code >= 50 && code <= 69) icon = "☔";
                    else if (code >= 70 && code <= 79) icon = "❄️";
                    else if (code >= 80) icon = "⛈️";

                    // 温度（小数点四捨五入）
                    const max = Math.round(daily.temperature_2m_max[i]);
                    const min = Math.round(daily.temperature_2m_min[i]);

                    html += `
                        <div class="day-box">
                            <div class="day-label">${dayLabel}</div>
                            <div class="icon">${icon}</div>
                            <div class="temp-box">
                                <span class="temp-max">${max}°C</span>
                                <span class="temp-min">${min}°C</span>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('weather-display').innerHTML = html;
            } catch (error) {
                console.error("API Error:", error);
                document.getElementById('weather-display').innerHTML = "データ取得エラー";
            }
        }

        getWeather();
    </script>
</body>
</html>
