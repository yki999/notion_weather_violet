<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Shimacho Weather</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-purple: #9D7BFF; 
            --light-purple: #c2adff;
        }
        /* 埋め込み枠全体を基準にするための設定 */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* 余計なスクロールバーを出さない */
        }
        body {
            background: transparent;
            color: var(--main-purple);
            font-family: 'Playfair Display', "Times New Roman", "YuMincho", serif;
            /* レスポンシブの起点を「横の中央」「縦の中央」に設定 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .widget-container {
            width: 100%;
            max-width: 550px; 
            display: flex;
            flex-direction: column;
            /* 縦の余白を元のゆったりサイズに戻しました */
            gap: 20px;
            position: relative;
        }
        
        /* --- 上段（今日の天気） --- */
        .top-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 15px; 
            align-items: center;
        }
        .title-block {
            grid-column: 1 / 3;
            text-align: center;
            line-height: 1.3;
        }
        .title-shimacho {
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .title-weather {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .current-icon {
            grid-column: 3 / 4;
            text-align: center;
            font-size: 32px;
        }
        .current-temp-block {
            grid-column: 4 / 6;
            text-align: center;
            line-height: 1.2;
        }
        .current-temp {
            font-size: 24px;
            font-weight: bold;
        }
        .current-desc {
            font-size: 13px;
            opacity: 0.9;
        }

        /* --- 下段（5日間予報） --- */
        .bottom-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            text-align: center;
        }
        .day-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .day-date {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 2px;
        }
        .day-label {
            font-size: 15px;
            /* 縦の余白を戻しました */
            margin-bottom: 5px;
        }
        .daily-icon {
            font-size: 24px;
            /* 縦の余白を戻しました */
            margin: 10px 0;
        }
        .temp-max {
            font-size: 15px;
            font-weight: bold;
        }
        .temp-min {
            font-size: 13px;
            color: var(--light-purple);
            /* 縦の余白を戻しました */
            margin-top: 3px;
        }

        /* --- 出典明記 --- */
        .source-container {
            text-align: right; 
            /* 縦の余白を戻しました */
            margin-top: 15px; 
        }
        .source {
            font-size: 10px;
            opacity: 0.6;
            text-decoration: none;
            color: var(--main-purple);
            font-family: sans-serif;
        }
        .source:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="top-row">
            <div class="title-block">
                <div class="title-shimacho">SHIMACHO</div>
                <div class="title-weather">WEATHER</div>
            </div>
            <div class="current-icon" id="current-icon">--</div>
            <div class="current-temp-block">
                <div class="current-temp" id="current-temp">--° / --°</div>
                <div class="current-desc" id="current-desc">Today</div>
            </div>
        </div>

        <div class="bottom-row" id="forecast-row">
            Loading...
        </div>

        <div class="source-container">
            <a href="https://www.jma.go.jp/" target="_blank" class="source">※出典: 気象庁 (JMA)</a>
        </div>
    </div>

    <script>
        function getJMAIcon(code) {
            const c = parseInt(code);
            if (c === 100 || c === 111 || c === 130 || c === 131) return "☀️";
            if (c >= 101 && c <= 114) return "⛅";
            if (c >= 200 && c <= 211) return "☁️";
            if (c >= 212 && c <= 219) return "☁️☔";
            if (c >= 300 && c <= 317) return "☔";
            if (c >= 400 && c <= 427) return "❄️";
            return "☁️";
        }

        async function getJMAWeather() {
            try {
                const url = 'https://www.jma.go.jp/bosai/forecast/data/forecast/110000.json';
                const res = await fetch(url);
                const data = await res.json();
                
                const jmaMap = {}; 

                const weekDates = data[1].timeSeries[0].timeDefines;
                const weekCodes = data[1].timeSeries[0].areas[0].weatherCodes;
                const weekMin = data[1].timeSeries[1].areas[0].tempsMin;
                const weekMax = data[1].timeSeries[1].areas[0].tempsMax;

                for(let i=0; i<weekDates.length; i++) {
                    const d = new Date(weekDates[i]);
                    const key = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
                    jmaMap[key] = { code: weekCodes[i], min: weekMin[i], max: weekMax[i] };
                }

                const dailyDates = data[0].timeSeries[0].timeDefines;
                const dailyCodes = data[0].timeSeries[0].areas[0].weatherCodes;
                for(let i=0; i<dailyDates.length; i++) {
                    const d = new Date(dailyDates[i]);
                    const key = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
                    if(!jmaMap[key]) jmaMap[key] = {};
                    jmaMap[key].code = dailyCodes[i];
                }

                const today = new Date(); 
                const todayKey = `${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
                const todayData = jmaMap[todayKey] || {};
                
                const todayIcon = todayData.code ? getJMAIcon(todayData.code) : "☁️";
                const todayMax = (todayData.max && todayData.max !== "") ? todayData.max : "--";
                const todayMin = (todayData.min && todayData.min !== "") ? todayData.min : "--";
                
                document.getElementById('current-icon').textContent = todayIcon;
                document.getElementById('current-temp').textContent = `${todayMax}° / ${todayMin}°`;

                let html = '';
                const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                
                for (let i = 1; i <= 5; i++) {
                    const targetDate = new Date();
                    targetDate.setDate(today.getDate() + i); 
                    
                    const key = `${targetDate.getFullYear()}-${targetDate.getMonth()+1}-${targetDate.getDate()}`;
                    const dayData = jmaMap[key] || {};
                    
                    const month = targetDate.getMonth() + 1;
                    const day = targetDate.getDate();
                    const dayLabel = dayNames[targetDate.getDay()];
                    
                    const dailyIcon = dayData.code ? getJMAIcon(dayData.code) : "☁️"; 
                    const max = (dayData.max && dayData.max !== "") ? dayData.max : "--";
                    const min = (dayData.min && dayData.min !== "") ? dayData.min : "--";

                    html += `
                        <div class="day-box">
                            <div class="day-date">${month}/${day}</div>
                            <div class="day-label">${dayLabel}</div>
                            <div class="daily-icon">${dailyIcon}</div>
                            <div class="temp-max">${max}°C</div>
                            <div class="temp-min">${min}°C</div>
                        </div>
                    `;
                }
                document.getElementById('forecast-row').innerHTML = html;

            } catch (error) {
                console.error("JMA API Error:", error);
                document.getElementById('forecast-row').innerHTML = `<div style="grid-column: span 5; font-size: 14px;">気象庁データの取得に失敗しました。</div>`;
            }
        }

        getJMAWeather();
    </script>
</body>
</html>
