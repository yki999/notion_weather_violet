<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>島町ピンポイント天気</title>
    <style>
        :root {
            --accent-color: #9D7BFF; /* カレンダーに合わせたパープル */
        }
        body {
            background: transparent;
            color: var(--accent-color);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
            text-align: center;
        }
        .widget-title {
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            opacity: 0.8;
        }
        .weather-container {
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        .day-box {
            width: 70px;
        }
        .day-label { font-size: 14px; margin-bottom: 5px; }
        .weather-icon { font-size: 24px; margin: 10px 0; }
        .temp { font-size: 16px; font-weight: bold; }
        .precip { font-size: 11px; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="widget-title">SHIMACHO WEATHER (JMA)</div>
    <div class="weather-container" id="weather-output">
        読み込み中...
    </div>

    <script>
        async function fetchJMA() {
            try {
                // 埼玉県のエリアコード: 110000
                const response = await fetch('https://www.jma.go.jp/bosai/forecast/data/forecast/110000.json');
                const data = await response.json();
                
                // さいたま市（南部）の予報を抽出
                const areaData = data[0].timeSeries[0];
                const weatherArray = areaData.areas[0].weathers; // 天気文
                const codeArray = areaData.areas[0].weatherCodes; // 天気アイコン用コード

                let html = '';
                // 直近3日分を表示
                for (let i = 0; i < 3; i++) {
                    const date = new Date();
                    date.setDate(date.getDate() + i);
                    const dayName = i === 0 ? 'Today' : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()];
                    
                    // 天気コードから簡易アイコン判定（ここはカスタマイズ可能）
                    let icon = "☁️"; 
                    if (codeArray[i] < 200) icon = "☀️";
                    else if (codeArray[i] >= 300) icon = "☔";

                    html += `
                        <div class="day-box">
                            <div class="day-label">${dayName}</div>
                            <div class="weather-icon">${icon}</div>
                            <div class="temp">--°C</div>
                        </div>
                    `;
                }
                document.getElementById('weather-output').innerHTML = html;
            } catch (e) {
                document.getElementById('weather-output').innerHTML = "取得エラー";
            }
        }
        fetchJMA();
    </script>
</body>
</html>
